<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Variable-position and fixed-position readout comparison</title>
  <desc id="desc">A two-by-two grid compares short and long sequences for variable-position and fixed-position readouts. Each example shows six token positions and the corresponding attention mask.</desc>

  <rect width="1600" height="980" fill="#ffffff"/>

  <style>
    .heading { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252a; }
    .subtitle { font: 400 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #59636c; }
    .column-title { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252a; }
    .column-note { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #68737c; }
    .row-title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20252a; }
    .axis-label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #77818a; }
    .grid-label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d5760; }
    .token { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #28323a; }
    .token-small { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #174f70; }
    .pad { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #858e95; }
    .mask-one { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #ffffff; }
    .mask-zero { font: 600 20px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #858e95; }
    .note { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3f4a52; }
    .cell { stroke: #c8d0d5; stroke-width: 1.25; }
  </style>

  <text x="70" y="68" class="heading">Readout position for variable-length inputs</text>
  <text x="70" y="108" class="subtitle">The final active token supplies the classification readout.</text>

  <text x="488" y="174" text-anchor="middle" class="column-title">Variable-position readout</text>
  <text x="488" y="205" text-anchor="middle" class="column-note">Append the readout token, then pad</text>
  <line x1="140" y1="228" x2="836" y2="228" stroke="#2a6f97" stroke-width="3"/>

  <text x="1240" y="174" text-anchor="middle" class="column-title">Fixed-position readout</text>
  <text x="1240" y="205" text-anchor="middle" class="column-note">Pad first, then append the readout token</text>
  <line x1="892" y1="228" x2="1588" y2="228" stroke="#2a6f97" stroke-width="3"/>

  <text x="70" y="278" class="row-title">Short input</text>

  <!-- Variable-position, short input -->
  <text x="220" y="267" class="grid-label">Tokens</text>
  <text x="196" y="296" text-anchor="middle" class="axis-label">1</text>
  <text x="308" y="296" text-anchor="middle" class="axis-label">2</text>
  <text x="420" y="296" text-anchor="middle" class="axis-label">3</text>
  <text x="532" y="296" text-anchor="middle" class="axis-label">4</text>
  <text x="644" y="296" text-anchor="middle" class="axis-label">5</text>
  <text x="756" y="296" text-anchor="middle" class="axis-label">6</text>

  <rect x="140" y="310" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="252" y="310" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="364" y="310" width="112" height="62" rx="7" fill="#dceef7" stroke="#2a6f97" stroke-width="2"/>
  <rect x="476" y="310" width="112" height="62" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="588" y="310" width="112" height="62" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="700" y="310" width="112" height="62" rx="7" fill="#f4f5f4" class="cell"/>
  <text x="196" y="348" text-anchor="middle" class="token">text</text>
  <text x="308" y="348" text-anchor="middle" class="token">text</text>
  <text x="420" y="347" text-anchor="middle" class="token-small">&lt;|endoftext|&gt;</text>
  <text x="532" y="348" text-anchor="middle" class="pad">PAD</text>
  <text x="644" y="348" text-anchor="middle" class="pad">PAD</text>
  <text x="756" y="348" text-anchor="middle" class="pad">PAD</text>

  <text x="140" y="408" class="grid-label">Attention mask</text>
  <rect x="140" y="424" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="252" y="424" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="364" y="424" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="476" y="424" width="112" height="50" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="588" y="424" width="112" height="50" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="700" y="424" width="112" height="50" rx="7" fill="#f4f5f4" class="cell"/>
  <text x="196" y="456" text-anchor="middle" class="mask-one">1</text>
  <text x="308" y="456" text-anchor="middle" class="mask-one">1</text>
  <text x="420" y="456" text-anchor="middle" class="mask-one">1</text>
  <text x="532" y="456" text-anchor="middle" class="mask-zero">0</text>
  <text x="644" y="456" text-anchor="middle" class="mask-zero">0</text>
  <text x="756" y="456" text-anchor="middle" class="mask-zero">0</text>

  <!-- Fixed-position, short input -->
  <text x="972" y="267" class="grid-label">Tokens</text>
  <text x="948" y="296" text-anchor="middle" class="axis-label">1</text>
  <text x="1060" y="296" text-anchor="middle" class="axis-label">2</text>
  <text x="1172" y="296" text-anchor="middle" class="axis-label">3</text>
  <text x="1284" y="296" text-anchor="middle" class="axis-label">4</text>
  <text x="1396" y="296" text-anchor="middle" class="axis-label">5</text>
  <text x="1508" y="296" text-anchor="middle" class="axis-label">6</text>

  <rect x="892" y="310" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1004" y="310" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1116" y="310" width="112" height="62" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="1228" y="310" width="112" height="62" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="1340" y="310" width="112" height="62" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="1452" y="310" width="112" height="62" rx="7" fill="#dceef7" stroke="#2a6f97" stroke-width="2"/>
  <text x="948" y="348" text-anchor="middle" class="token">text</text>
  <text x="1060" y="348" text-anchor="middle" class="token">text</text>
  <text x="1172" y="348" text-anchor="middle" class="pad">PAD</text>
  <text x="1284" y="348" text-anchor="middle" class="pad">PAD</text>
  <text x="1396" y="348" text-anchor="middle" class="pad">PAD</text>
  <text x="1508" y="347" text-anchor="middle" class="token-small">&lt;|endoftext|&gt;</text>

  <text x="892" y="408" class="grid-label">Attention mask</text>
  <rect x="892" y="424" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1004" y="424" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1116" y="424" width="112" height="50" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="1228" y="424" width="112" height="50" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="1340" y="424" width="112" height="50" rx="7" fill="#f4f5f4" class="cell"/>
  <rect x="1452" y="424" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <text x="948" y="456" text-anchor="middle" class="mask-one">1</text>
  <text x="1060" y="456" text-anchor="middle" class="mask-one">1</text>
  <text x="1172" y="456" text-anchor="middle" class="mask-zero">0</text>
  <text x="1284" y="456" text-anchor="middle" class="mask-zero">0</text>
  <text x="1396" y="456" text-anchor="middle" class="mask-zero">0</text>
  <text x="1508" y="456" text-anchor="middle" class="mask-one">1</text>

  <line x1="70" y1="530" x2="1564" y2="530" stroke="#d9dfe2" stroke-width="1.5"/>
  <text x="70" y="587" class="row-title">Long input</text>

  <!-- Variable-position, long input -->
  <text x="220" y="576" class="grid-label">Tokens</text>
  <text x="196" y="605" text-anchor="middle" class="axis-label">1</text>
  <text x="308" y="605" text-anchor="middle" class="axis-label">2</text>
  <text x="420" y="605" text-anchor="middle" class="axis-label">3</text>
  <text x="532" y="605" text-anchor="middle" class="axis-label">4</text>
  <text x="644" y="605" text-anchor="middle" class="axis-label">5</text>
  <text x="756" y="605" text-anchor="middle" class="axis-label">6</text>

  <rect x="140" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="252" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="364" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="476" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="588" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="700" y="619" width="112" height="62" rx="7" fill="#dceef7" stroke="#2a6f97" stroke-width="2"/>
  <text x="196" y="657" text-anchor="middle" class="token">text</text>
  <text x="308" y="657" text-anchor="middle" class="token">text</text>
  <text x="420" y="657" text-anchor="middle" class="token">text</text>
  <text x="532" y="657" text-anchor="middle" class="token">text</text>
  <text x="644" y="657" text-anchor="middle" class="token">text</text>
  <text x="756" y="656" text-anchor="middle" class="token-small">&lt;|endoftext|&gt;</text>

  <text x="140" y="717" class="grid-label">Attention mask</text>
  <rect x="140" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="252" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="364" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="476" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="588" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="700" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <text x="196" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="308" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="420" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="532" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="644" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="756" y="765" text-anchor="middle" class="mask-one">1</text>

  <!-- Fixed-position, long input -->
  <text x="972" y="576" class="grid-label">Tokens</text>
  <text x="948" y="605" text-anchor="middle" class="axis-label">1</text>
  <text x="1060" y="605" text-anchor="middle" class="axis-label">2</text>
  <text x="1172" y="605" text-anchor="middle" class="axis-label">3</text>
  <text x="1284" y="605" text-anchor="middle" class="axis-label">4</text>
  <text x="1396" y="605" text-anchor="middle" class="axis-label">5</text>
  <text x="1508" y="605" text-anchor="middle" class="axis-label">6</text>

  <rect x="892" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1004" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1116" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1228" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1340" y="619" width="112" height="62" rx="7" fill="#e8edf0" class="cell"/>
  <rect x="1452" y="619" width="112" height="62" rx="7" fill="#dceef7" stroke="#2a6f97" stroke-width="2"/>
  <text x="948" y="657" text-anchor="middle" class="token">text</text>
  <text x="1060" y="657" text-anchor="middle" class="token">text</text>
  <text x="1172" y="657" text-anchor="middle" class="token">text</text>
  <text x="1284" y="657" text-anchor="middle" class="token">text</text>
  <text x="1396" y="657" text-anchor="middle" class="token">text</text>
  <text x="1508" y="656" text-anchor="middle" class="token-small">&lt;|endoftext|&gt;</text>

  <text x="892" y="717" class="grid-label">Attention mask</text>
  <rect x="892" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1004" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1116" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1228" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1340" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <rect x="1452" y="733" width="112" height="50" rx="7" fill="#2a6f97" class="cell"/>
  <text x="948" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="1060" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="1172" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="1284" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="1396" y="765" text-anchor="middle" class="mask-one">1</text>
  <text x="1508" y="765" text-anchor="middle" class="mask-one">1</text>

  <line x1="140" y1="843" x2="812" y2="843" stroke="#c8d0d5" stroke-width="1.5"/>
  <line x1="892" y1="843" x2="1564" y2="843" stroke="#c8d0d5" stroke-width="1.5"/>
  <text x="476" y="882" text-anchor="middle" class="note">The readout moves from position 3 to position 6.</text>
  <text x="1228" y="882" text-anchor="middle" class="note">The readout remains at position 6.</text>

  <rect x="70" y="921" width="20" height="20" rx="4" fill="#dceef7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="102" y="937" class="axis-label">readout token</text>
  <rect x="244" y="921" width="20" height="20" rx="4" fill="#e8edf0" stroke="#c8d0d5" stroke-width="1.25"/>
  <text x="276" y="937" class="axis-label">text token</text>
  <rect x="402" y="921" width="20" height="20" rx="4" fill="#f4f5f4" stroke="#c8d0d5" stroke-width="1.25"/>
  <text x="434" y="937" class="axis-label">padding</text>
</svg>
